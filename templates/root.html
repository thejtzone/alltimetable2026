<head>

    <style>
        iframe { width: 100dvw; height: 100dvh; margin: 0; padding: 0; border: 0; position: fixed; left: 0; top: 0; }
    </style>

    <link rel="stylesheet" type="text/css" href="/static/css/common.css">

</head>

<body>

    <iframe src="/internal/{{path}}" width="100%" height="100%"></iframe>

</body>

<script>

    function href(href) {
        document.querySelector('iframe').src = href;
        window.history.pushState({}, '', href);
    }

    function handleMessage(event) {
        console.log(event);
        switch (event.data.type) {
            case 'href': href(event.data.href);
        }
    }

    window.addEventListener('message', handleMessage);

</script>
